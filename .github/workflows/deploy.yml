name: Deploy

# Deploys main after CI passes on it, or on demand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The exact commit CI passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.jsonc requires SECRETS_KEYRING, which an operator sets once by hand (see
      # apps/platform/README.md, "Secrets"). Without it the deploy would fail after the migrations ran.
      - name: Check the platform's required secrets are set
        working-directory: apps/platform
        run: |
          held=$(pnpm --silent wrangler secret list --format json | jq -r '.[].name')
          if ! grep -qx SECRETS_KEYRING <<<"$held"; then
            echo "::error::throng has no SECRETS_KEYRING; set it with 'pnpm wrangler secret put SECRETS_KEYRING' (apps/platform/README.md, Secrets)"
            exit 1
          fi
      - name: Apply D1 migrations
        if: hashFiles('apps/platform/migrations/*.sql') != ''
        working-directory: apps/platform
        run: pnpm wrangler d1 migrations apply throng --remote
      # wrangler.jsonc can't declare lifecycle rules, so r2-lifecycle.json is set on every deploy.
      - name: Apply the logs bucket's lifecycle rules
        working-directory: apps/platform
        run: |
          pnpm wrangler r2 bucket info throng-logs >/dev/null 2>&1 || pnpm wrangler r2 bucket create throng-logs
          pnpm wrangler r2 bucket lifecycle set throng-logs --file r2-lifecycle.json --force
      # Pipeline caches: the project Durable Objects evict them, so the bucket keeps R2's default rules.
      - name: Create the caches bucket
        working-directory: apps/platform
        run: pnpm wrangler r2 bucket info throng-caches >/dev/null 2>&1 || pnpm wrangler r2 bucket create throng-caches
      # The platform first: throng-web binds to it.
      - run: pnpm --filter @throng/platform run deploy
      - run: pnpm --filter @throng/web run deploy
