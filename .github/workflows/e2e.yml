name: E2E

# Runs the e2e scenarios against real Artifacts: deploys the `ci` environments (the `throng-ci`
# and `throng-web-ci` Workers) and runs `pnpm e2e` against them. Manual only, from the Actions tab; see
# apps/platform/README.md for the setup it needs.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Space-separated e2e scenarios to run (empty runs them all)
        required: false
        default: ""

# One run at a time: they share the throng-ci Worker. Never cancel one halfway, or its repos leak.
concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    if: github.repository == 'gregjoeval/throng'
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects `env.ci` in apps/platform/wrangler.jsonc for vite build and wrangler alike.
      CLOUDFLARE_ENV: ci
      # Every project this run creates starts with this, so cleanup can find it. The Worker's e2e
      # routes only accept ids starting with `e2e`. The trailing `p` keeps one run's prefix from being
      # a prefix of another's.
      E2E_PROJECT_PREFIX: e2eci${{ github.run_id }}r${{ github.run_attempt }}p
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate this run's E2E_TOKEN
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >> "$GITHUB_ENV"
      # A fresh keyring per run is enough: every project a run makes, and so every secret, is deleted at its end.
      - name: Generate this run's SECRETS_KEYRING
        run: |
          keyring=$(printf '{"current":"e2e","keys":{"e2e":"%s"}}' "$(openssl rand -base64 32)")
          echo "::add-mask::$keyring"
          echo "SECRETS_KEYRING=$keyring" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        if: hashFiles('apps/platform/migrations/*.sql') != ''
        run: pnpm exec wrangler d1 migrations apply throng-ci --remote
      # wrangler.jsonc can't declare lifecycle rules, so r2-lifecycle.json is set on every deploy.
      - name: Apply the logs bucket's lifecycle rules
        run: |
          pnpm exec wrangler r2 bucket info throng-ci-logs >/dev/null 2>&1 || pnpm exec wrangler r2 bucket create throng-ci-logs
          pnpm exec wrangler r2 bucket lifecycle set throng-ci-logs --file r2-lifecycle.json --force
      # Pipeline caches: the project Durable Objects evict them, so the bucket keeps R2's default rules.
      - name: Create the caches bucket
        run: pnpm exec wrangler r2 bucket info throng-ci-caches >/dev/null 2>&1 || pnpm exec wrangler r2 bucket create throng-ci-caches
      - name: Deploy throng-ci
        run: |
          pnpm exec vite build
          secrets="$RUNNER_TEMP/throng-ci-secrets.env"
          trap 'rm -f "$secrets"' EXIT
          printf 'E2E_TOKEN=%s\nSECRETS_KEYRING=%s\n' "$E2E_TOKEN" "$SECRETS_KEYRING" > "$secrets"
          # The build already resolved the `ci` environment into dist/; with CLOUDFLARE_ENV still set,
          # wrangler would apply it again and deploy `throng-ci-ci`.
          env -u CLOUDFLARE_ENV pnpm exec wrangler deploy --config dist/throng/wrangler.json --secrets-file "$secrets" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://throng-ci\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL for throng-ci in the deploy output"
            exit 1
          fi
          echo "THRONG_URL=$url" >> "$GITHUB_ENV"
      - name: Wait for the new deployment
        run: |
          # A new Worker's workers.dev route, and a new E2E_TOKEN, can take a moment to go live.
          for _ in $(seq 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $E2E_TOKEN" \
              "$THRONG_URL/e2e/repos?prefix=$E2E_PROJECT_PREFIX" || true)
            if [ "$status" = 200 ]; then exit 0; fi
            echo "throng-ci answered $status; waiting"
            sleep 5
          done
          echo "::error::$THRONG_URL never accepted this run's E2E_TOKEN"
          exit 1
      # The arena scenario drives throng-web in a browser. Its `ci` environment binds to throng-ci.
      - name: Deploy throng-web-ci
        working-directory: apps/web
        run: |
          pnpm exec vite build
          env -u CLOUDFLARE_ENV pnpm exec wrangler deploy --config dist/server/wrangler.json | tee "$RUNNER_TEMP/deploy-web.log"
          url=$(grep -oE 'https://throng-web-ci\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy-web.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL for throng-web-ci in the deploy output"
            exit 1
          fi
          echo "THRONG_WEB_URL=$url" >> "$GITHUB_ENV"
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for throng-web-ci
        run: |
          # The scenario loads pages without an Access session, so a redirect to sign in never ends.
          for _ in $(seq 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$THRONG_WEB_URL/" || true)
            if [ "$status" = 200 ]; then exit 0; fi
            echo "throng-web-ci answered $status; waiting"
            sleep 5
          done
          echo "::error::$THRONG_WEB_URL never answered 200; is it behind Cloudflare Access?"
          exit 1
      - name: Run the e2e suite
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # Word-split on purpose: one argument per scenario name.
          # shellcheck disable=SC2086
          pnpm e2e $SCENARIOS
      - name: Delete everything this run made
        if: always() && env.THRONG_URL != ''
        run: pnpm e2e cleanup
