# Git hooks, installed by `pnpm install`. CI runs the full checks; this catches the cheap ones first.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,css,json,jsonc,md,yml,yaml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js}"
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
